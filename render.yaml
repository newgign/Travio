# Preparation only. Importing this Blueprint is an explicit deployment action.
# Create/select an isolated PostgreSQL database manually before importing.
services:
  - type: web
    name: asedeliya-staging-api
    runtime: node
    plan: free
    branch: develop
    autoDeployTrigger: "off"
    # Repository root is required for database/migrations.
    buildCommand: npm --prefix backend ci --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_MODE
        value: verify-full
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OFFER_TOKEN_SECRET
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ACTIVE_PROVIDER
        value: hotelbeds
      - key: HOTELBEDS_ENV
        value: test
      - key: HOTELBEDS_ENABLED
        value: "false"
      - key: HOTELBEDS_READ_ONLY
        value: "true"
      - key: HOTELBEDS_BOOKING_ENABLED
        value: "false"
      - key: HOTELBEDS_LIVE_BOOKING_ENABLED
        value: "false"
      - key: HOT_DEALS_MONITOR_ENABLED
        value: "false"
      - key: HOTELBEDS_CONTENT_SYNC_ENABLED
        value: "false"
      - key: PAYMENTS_MODE
        value: disabled
      - key: PAYMENTS_PROVIDER
        value: none
      - key: PRODUCTION_SALES_ENABLED
        value: "false"
      - key: REAL_CHARGES_ENABLED
        value: "false"
      - key: REAL_REFUNDS_ENABLED
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: DB_BACKUP_AUTO_ENABLED
        value: "false"
      - key: HEALTH_MONITOR_ENABLED
        value: "false"
      - key: RELIABILITY_MONITOR_ENABLED
        value: "false"
      - key: LOG_FORMAT
        value: json
  - type: web
    name: asedeliya-staging-web
    runtime: static
    branch: develop
    rootDir: frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && node scripts/validate-staging-env.mjs && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
